<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Get the path without the domain
      var pathSegments = window.location.pathname.split('/').slice(1);
      
      // Redirect to index.html with the path as a query parameter
      sessionStorage.redirect = '/' + pathSegments.slice(1).join('/');
      location.replace(window.location.origin + '/' + pathSegments[0] + '/?redirect');
    </script>
  </head>
  <body>
  </body>
</html>
